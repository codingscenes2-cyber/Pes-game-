name: Android ARM64 test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android platform
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          # Godot 4.3 headless dummy renderer emits this mesh-storage diagnostic.
          # Android GLES export uses a real renderer; fail on all other errors.
          check_godot_log() {
            local log_file="$1"
            if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$log_file" | grep -vF 'ERROR: Parameter "m" is null.'; then
              echo "Unexpected Godot error in $log_file"
              return 1
            fi
          }
          check_godot_log /tmp/godot-import.log
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-boot.log
          check_godot_log /tmp/godot-boot.log

      - name: Export installable ARM64 test APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android ARM64" build/android/PES-M1-M3-ARM64-TEST.apk
          test -s build/android/PES-M1-M3-ARM64-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES-M1-M3-ARM64-TEST-APK
          path: build/android/PES-M1-M3-ARM64-TEST.apk
          if-no-files-found: error
          retention-days: 14
